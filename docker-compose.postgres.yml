services:
  postgres:
    image: postgres:16-alpine
    container_name: no-nameglish-postgres
    restart: always
    environment:
      POSTGRES_USER: nameglish
      POSTGRES_PASSWORD: nameglish123
      POSTGRES_DB: no_nameglish
    ports:
      - "5434:5432"
    volumes:
      - no-nameglish-pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nameglish -d no_nameglish"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  no-nameglish-pgdata:
